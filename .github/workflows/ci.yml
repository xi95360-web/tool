name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zotero-word-translate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zotero-word-translate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: node --check bootstrap.js
      - name: Build XPI
        run: python scripts/build_xpi.py
      - name: Inspect package
        run: unzip -t dist/*.xpi

  zoom-recording-helper:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: zoom-recording-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
