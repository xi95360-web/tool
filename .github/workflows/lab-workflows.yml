name: Lab workflows
on:
  push:
    paths: ['quickchange-seq-check/**', 'confocal-cell-measurements/**', 'sting-structure-triage/**', 'sting-mutant-databank/**', 'tests/**', '.github/workflows/lab-workflows.yml']
  pull_request:
    paths: ['quickchange-seq-check/**', 'confocal-cell-measurements/**', 'sting-structure-triage/**', 'sting-mutant-databank/**', 'tests/**', '.github/workflows/lab-workflows.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install ./quickchange-seq-check -r confocal-cell-measurements/requirements.txt
      - run: python -m unittest discover -s tests -v
